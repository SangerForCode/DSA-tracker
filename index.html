            const [startDate, setStartDate] = useState(null);
            const [monthsTarget, setMonthsTarget] = useState(5); 
            
            // UI State
            const [loading, setLoading] = useState(true);

            const [expandedCategories, setExpandedCategories] = useState({});
            const [activeTab, setActiveTab] = useState('tracker'); // 'roadmap', 'tracker', 'rules'

            // --- SHARED DOCUMENT REFERENCE ---
            // Using a specific ID for the global tracker ensures everyone connects to the same doc
            const sharedDocRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'trackers', 'global_a2z_tracker');

            // --- LOGIC: Authentication & Initial Data Fetch ---
            useEffect(() => {
                const init = async () => {
                    // Simple anonymous auth for standalone file
                    await signInAnonymously(auth);
                };
                
                init();
                
                const unsubscribeAuth = onAuthStateChanged(auth, async (u) => {
                    if (u) {
                        setUser(u);
                    }
                });

                // --- REAL-TIME SYNC LISTENER ---
                // Replaces getDoc with onSnapshot for instant updates across all users
                const unsubscribeSnapshot = onSnapshot(sharedDocRef, async (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        setProgress(data.progress || {});
                        
                        // Handle potential timestamp differences
                        if (data.startDate) {
                             // Firestore timestamps have a toDate() method, but basic objects don't
                             const dateVal = data.startDate.toDate ? data.startDate.toDate() : new Date(data.startDate);
                             setStartDate(dateVal);
                        }
                        
                        if (data.targetMonths) setMonthsTarget(data.targetMonths);
                    } else {
                        // Initialize shared doc if it doesn't exist yet
                         const now = new Date();
                         await setDoc(sharedDocRef, {
                            startDate: serverTimestamp(),
                            progress: {},
                            targetMonths: 5
                        });
                        setStartDate(now);
                    }
                    setLoading(false);
                });

                return () => {
                    unsubscribeAuth();
                    unsubscribeSnapshot();
                };
            }, []);

            // --- LOGIC: Progress Updates ---
            const getProgressItem = (vidId) => {
                const item = progress[vidId];
                if (typeof item === 'boolean') { // Legacy support
                    return { complete: item, confidence: 0, revisited: false };
                }
                return item || { complete: false, confidence: 0, revisited: false };
            };

            const updateProgress = async (vidId, updates) => {
                if (!user) return;
                const currentItem = getProgressItem(vidId);
                const newItem = { ...currentItem, ...updates };
                
                // Optimistic UI Update (for immediate feedback)
                const newProgress = { ...progress, [vidId]: newItem };
                setProgress(newProgress);

                // DB Update - Using setDoc with merge for granular updates
                // This ensures we don't overwrite other users' changes to other videos
                try {
                    await setDoc(sharedDocRef, {
                        progress: {
                            [vidId]: newItem
                        }
                    }, { merge: true });
                } catch (err) {
                    console.error("Failed to save progress", err);
                    // Revert optimistic update if needed, though rare with firestore offline support
                }
            };

            const updateTargetMonths = async (months) => {
                setMonthsTarget(months);
                if(user) {
                    await setDoc(sharedDocRef, { targetMonths: months }, { merge: true });
                }
            };

            const toggleCategory = (catName) => {
                setExpandedCategories(prev => ({
                    ...prev,
                    [catName]: !prev[catName]
                }));
            };

            // --- CALCULATIONS: Pacing & Metrics ---
            const stats = useMemo(() => {
                if (!startDate) return { completed: 0, percentage: 0, expectedIndex: 0, status: 'neutral', expectedPhase: 0 };

                let completedCount = 0;
                let confidenceSum = 0;
                let ratedCount = 0;
                
                Object.values(progress).forEach(p => {
                    const item = (typeof p === 'boolean') ? { complete: p, confidence: 0 } : p;
                    if (item.complete) completedCount++;
                    if (item.confidence > 0) {
                        confidenceSum += item.confidence;
                        ratedCount++;
                    }
                });

                const percentage = Math.round((completedCount / TOTAL_VIDEOS) * 100);
                const avgConfidence = ratedCount > 0 ? (confidenceSum / ratedCount).toFixed(1) : "0.0";
                
                const now = new Date();
                const daysSinceStart = Math.max(0, (now - startDate) / (1000 * 60 * 60 * 24));
                const totalDays = monthsTarget * 30;
                
                // Linear projection
                let expectedIndex = Math.floor((daysSinceStart / totalDays) * TOTAL_VIDEOS);
                if (expectedIndex > TOTAL_VIDEOS) expectedIndex = TOTAL_VIDEOS;

                // --- PHASE MAPPING LOGIC ---
                const PHASE_WEIGHTS = [0.03, 0.22, 0.22, 0.35, 0.18];
                let cumulative = 0;
                let expectedPhaseId = 0;
                const progressRatio = Math.min(1, daysSinceStart / totalDays);

                for (let i = 0; i < PHASE_WEIGHTS.length; i++) {
                    cumulative += PHASE_WEIGHTS[i];
                    if (progressRatio <= cumulative) {
                        expectedPhaseId = i;
                        break;
                    }
                }
                if (progressRatio >= 0.99) expectedPhaseId = 4; // Cap at last phase if near end

                // Status Determination
                const actualIndex = completedCount; 
                let status = 'On Track';
                let statusColor = 'text-green-400';
                let diff = actualIndex - expectedIndex;

                if (diff < -5) {
                    status = `Behind by ${Math.abs(diff)} videos`;
                    statusColor = 'text-red-400';
                } else if (diff > 5) {
                    status = `Ahead by ${diff} videos`;
                    statusColor = 'text-indigo-400';
                }

                // Phase Progress
                const phaseProgress = PHASES.map(phase => {
                    if (phase.id === 4) return { id: 4, count: 0, total: 0, percent: 0 }; // Manual phase
                    const phaseVideos = COURSE_DATA.filter(c => c.phase === phase.id).reduce((acc, c) => acc + c.videos.length, 0);
                    const phaseCompleted = COURSE_DATA.filter(c => c.phase === phase.id).reduce((acc, c) => {
                        return acc + c.videos.filter(v => getProgressItem(v.id).complete).length;
                    }, 0);
                    return {
                        id: phase.id,
                        count: phaseCompleted,
                        total: phaseVideos,
                        percent: phaseVideos === 0 ? 0 : Math.round((phaseCompleted / phaseVideos) * 100)
                    };
                });

                return { 
                    completed: completedCount, 
                    percentage, 
                    expectedIndex, 
                    status, 
                    statusColor, 
                    daysSinceStart, 
                    totalDays,
                    avgConfidence,
                    phaseProgress,
                    expectedPhaseId
                };

                                                                            key={star}
                                                                            onClick={() => updateProgress(video.id, { confidence: star })}
                                                                            className={`text-[10px] ${item.confidence >= star ? 'text-yellow-500' : 'text-slate-700 hover:text-yellow-600'}`}
                                                                        >
                                                                            <Star size={12} fill={item.confidence >= star ? "currentColor" : "none"} />
                                                                        </button>
                                                                    ))}
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="flex items-center gap-2 pl-10 md:pl-0">
                                                    {/* Revisit Toggle */}
                                                    {item.complete && (
                                                        <button
                                                            onClick={() => updateProgress(video.id, { revisited: !item.revisited })}
                                                            className={`p-1.5 rounded text-xs flex items-center gap-1 ${item.revisited ? 'text-green-400 bg-green-400/10' : 'text-slate-600 hover:text-slate-400'}`}
                                                            title="Mark as Revisited"
                                                        >
                                                            <RefreshCw size={14} className={item.revisited ? '' : ''} />
                                                            {item.revisited ? 'Revisited' : ''}
                                                        </button>
                                                    )}
                                                    
                                                    <button 
                                                        onClick={() => setActiveVideo(video)}
                                                        className="p-2 text-slate-600 hover:text-indigo-400 hover:bg-indigo-500/10 rounded-lg transition-all"
                                                        title="Open Notes & Comments"
                                                    >
                                                        <MessageSquare size={18} />
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    );
                });
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 font-sans selection:bg-indigo-500/30 flex flex-col">
                    
                    {/* TOP DASHBOARD (Compact) */}
                    <div className="bg-slate-950/90 border-b border-slate-800 sticky top-0 z-30 backdrop-blur-md">
                        <div className="max-w-4xl mx-auto px-4 pt-4 pb-0">
                            <div className="flex justify-between items-start mb-2">
                                <div>
                                    <div className="flex items-center gap-2">
                                        <h1 className="text-xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
                                            Striver's A2Z Phase Tracker
                                        </h1>
                                        <span className="bg-indigo-500/10 text-indigo-400 text-[10px] px-2 py-0.5 rounded border border-indigo-500/20 flex items-center gap-1">
                                            <Users size={10} /> LIVE SHARED
                                        </span>
                                    </div>
                                    <p className="text-[10px] uppercase tracking-wider text-slate-500 mt-1">
                                        Day {Math.floor(stats.daysSinceStart)} • Target: {monthsTarget} Mo
                                    </p>
                                </div>
                                <div className="text-right">
                                    <div className={`font-mono font-bold text-sm ${stats.statusColor}`}>
                                        {stats.status}
                                    </div>
                                    <div className="flex items-center justify-end gap-2 text-xs text-slate-400 mt-1">
                                        <span className="flex items-center gap-1 bg-slate-900 px-1.5 py-0.5 rounded border border-slate-800 text-indigo-300">
                                            <CalendarClock size={10} /> Expected: Phase {stats.expectedPhaseId}
                                        </span>
                                        <span>
                                            {stats.completed}/{TOTAL_VIDEOS} Done
                                        </span>
                                    </div>
                                </div>
                            </div>

                            {/* Navigation Tabs */}
                            <div className="flex gap-6 mt-4 text-sm font-medium">
                                <button 
                                    onClick={() => setActiveTab('roadmap')}
                                    className={`pb-3 border-b-2 px-1 transition-colors ${activeTab === 'roadmap' ? 'border-indigo-500 text-white' : 'border-transparent text-slate-500 hover:text-slate-300'}`}
                                >
                                    Roadmap
                                </button>
                                <button 
                                    onClick={() => setActiveTab('tracker')}
                                    className={`pb-3 border-b-2 px-1 transition-colors ${activeTab === 'tracker' ? 'border-indigo-500 text-white' : 'border-transparent text-slate-500 hover:text-slate-300'}`}
                                >
                                    Video Tracker
                                </button>
                                <button 
                                    onClick={() => setActiveTab('rules')}
                                    className={`pb-3 border-b-2 px-1 transition-colors ${activeTab === 'rules' ? 'border-indigo-500 text-white' : 'border-transparent text-slate-500 hover:text-slate-300'}`}
                                >
                                    Rules & Metrics
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* MAIN CONTENT AREA */}
                    <div className="flex-1 max-w-4xl mx-auto px-4 py-6 w-full pb-20">
                        
                        {/* --- TAB 1: ROADMAP --- */}
                        {activeTab === 'roadmap' && (
                            <div className="space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-500">
                                {PHASES.map((phase) => {
                                    const pStats = stats.phaseProgress.find(p => p.id === phase.id) || { percent: 0, count: 0, total: 0 };
                                    const isCurrentExpected = stats.expectedPhaseId === phase.id;
                                    
                                    return (
                                        <div key={phase.id} className={`relative pl-8 border-l ${isCurrentExpected ? 'border-indigo-500' : 'border-slate-800'}`}>
                                            {/* Timeline Dot */}
                                            <div className={`absolute -left-[9px] top-0 w-4 h-4 rounded-full bg-gradient-to-br ${phase.color} shadow-[0_0_10px_rgba(99,102,241,0.5)] ${isCurrentExpected ? 'ring-2 ring-white scale-125' : ''}`}></div>
                                            
                                            <div className="mb-6">
                                                <div className="flex justify-between items-baseline mb-2">
                                                    <div className="flex items-center gap-2">
                                                        <h2 className={`text-lg font-bold bg-gradient-to-r ${phase.color} bg-clip-text text-transparent`}>
                                                            {phase.title}
                                                        </h2>
                                                        {isCurrentExpected && (
                                                            <span className="text-[10px] bg-indigo-500 text-white px-1.5 py-0.5 rounded font-bold uppercase tracking-wide animate-pulse">
                                                                Current Goal
                                                            </span>
                                                        )}
                                                    </div>
                                                    <span className="text-xs font-mono text-slate-500 bg-slate-900 px-2 py-1 rounded border border-slate-800">
                                                        {phase.duration}
                                                    </span>
                                                </div>
                                                
                                                <div className={`bg-slate-900/50 border rounded-xl p-5 mb-3 ${isCurrentExpected ? 'border-indigo-500/40 bg-indigo-500/5' : 'border-slate-800'}`}>
                                                    <p className="text-slate-300 italic mb-4 font-serif text-lg">"{phase.goal}"</p>
                                                    
                                                    <div className="grid md:grid-cols-2 gap-4">
                                                        <div>
                                                            <h4 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Exit Criteria</h4>
                                                            <ul className="space-y-2">
                                                                {phase.exitCriteria.map((crit, idx) => (
                                                                    <li key={idx} className="flex items-start gap-2 text-sm text-slate-400">
                                                                        <Target size={14} className="mt-0.5 text-slate-600" />
                                                                        {crit}
                                                                    </li>
                                                                ))}
                                                            </ul>
                                                        </div>
                                                        {phase.id !== 4 && (
                                                            <div className="bg-slate-950 p-4 rounded-lg border border-slate-800 flex flex-col justify-center">
                                                                <div className="flex justify-between text-xs text-slate-400 mb-2">
                                                                    <span>Phase Progress</span>
                                                                    <span>{pStats.percent}%</span>
                                                                </div>
                                                                <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                                                                    <div 
                                                                        className={`h-full bg-gradient-to-r ${phase.color}`} 
                                                                        style={{ width: `${pStats.percent}%` }}
                                                                    />
                                                                </div>
                                                                <p className="text-[10px] text-slate-600 mt-2 text-center">{pStats.count} / {pStats.total} Videos</p>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                                {phase.id === 4 && (
                                                    <div className="p-4 bg-yellow-500/10 border border-yellow-500/20 rounded-lg text-sm text-yellow-200/80">
                                                        <AlertTriangle className="inline mr-2 mb-1" size={16}/>
                                                        This phase is about mock interviews and re-solving hard problems. No new videos tracked here.
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {/* --- TAB 2: TRACKER --- */}
                        {activeTab === 'tracker' && (
                            <div className="space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-500">
                                {PHASES.filter(p => p.id !== 4).map((phase) => (
                                    <div key={phase.id}>
                                        <div className="sticky top-[110px] z-20 bg-slate-950/95 backdrop-blur py-2 mb-4 border-b border-slate-800 flex items-center gap-2">
                                            <div className={`w-3 h-3 rounded-full bg-gradient-to-r ${phase.color}`}></div>
                                            <h2 className="font-bold text-slate-200">{phase.title}</h2>
                                            {stats.expectedPhaseId === phase.id && (
                                                <span className="text-[10px] bg-slate-800 text-indigo-300 border border-indigo-500/30 px-1.5 py-0.5 rounded ml-2">
                                                    You should be here
                                                </span>
                                            )}
                                        </div>
                                        {renderPhaseGroup(phase.id)}
                                    </div>
                                ))}
                                
                                <div className="text-center py-10 opacity-50">
                                    <Trophy size={48} className="mx-auto mb-4 text-slate-600" />
                                    <h3 className="text-lg font-bold">Phase 4: The Final Stretch</h3>
                                    <p className="text-sm">No videos here. Go to LeetCode/Gfg and practice efficiently!</p>
                                </div>
                            </div>
                        )}

                        {/* --- TAB 3: RULES & METRICS --- */}
                        {activeTab === 'rules' && (
                            <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                                {/* Stats Cards */}
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                                        <div className="text-slate-500 text-xs uppercase font-bold mb-1">Total Solved</div>
                                        <div className="text-2xl font-bold text-white">{stats.completed}</div>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                                        <div className="text-slate-500 text-xs uppercase font-bold mb-1">Confidence</div>
                                        <div className="text-2xl font-bold text-yellow-500 flex items-center gap-1">
                                            {stats.avgConfidence} <Star size={18} fill="currentColor"/>
                                        </div>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                                        <div className="text-slate-500 text-xs uppercase font-bold mb-1">Pace</div>
                                        <div className={`text-lg font-bold ${stats.statusColor}`}>{stats.status.split(' ')[0]}</div>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                                        <div className="text-slate-500 text-xs uppercase font-bold mb-1">Target</div>
                                        <select 
                                            value={monthsTarget} 
                                            onChange={(e) => updateTargetMonths(Number(e.target.value))}
                                            className="bg-transparent text-lg font-bold text-white outline-none w-full cursor-pointer"
                                        >
                                            <option value={3}>3 Months</option>
                                            <option value={4}>4 Months</option>
                                            <option value={4.5}>4.5 Mo</option>
                                            <option value={5}>5 Months</option>
                                            <option value={6}>6 Months</option>
                                        </select>
                                    </div>
                                </div>

                                {/* Golden Rules */}
                                <div className="bg-red-500/5 border border-red-500/20 rounded-xl p-6">
                                    <h3 className="text-red-400 font-bold flex items-center gap-2 mb-4">
                                        <AlertTriangle /> GOLDEN RULES (NON-NEGOTIABLE)
                                    </h3>
                                    <div className="space-y-4">
                                        <div className="flex gap-3">
                                            <span className="font-bold text-red-500/50 text-xl">01</span>
                                            <div>
                                                <h4 className="font-bold text-slate-200">Video → Problem → Explanation</h4>
                                                <p className="text-sm text-slate-400">No video without solving problems. No skipping practice.</p>
                                            </div>
                                        </div>
                                        <div className="flex gap-3">
                                            <span className="font-bold text-red-500/50 text-xl">02</span>
                                            <div>
                                                <h4 className="font-bold text-slate-200">30-Minute Struggle Rule</h4>
                                                <p className="text-sm text-slate-400">Try 30 mins → Hints → Editorial → Re-solve next day.</p>
                                            </div>
                                        </div>
                                        <div className="flex gap-3">
                                            <span className="font-bold text-red-500/50 text-xl">03</span>
                                            <div>
                                                <h4 className="font-bold text-slate-200">Mistake Log (Mandatory)</h4>
                                                <p className="text-sm text-slate-400">Write down why it failed and what pattern fixed it.</p>
                                            </div>
                                        </div>
                                        <div className="flex gap-3">
                                            <span className="font-bold text-red-500/50 text-xl">04</span>
                                            <div>
                                                <h4 className="font-bold text-slate-200">One Language Only</h4>
                                                <p className="text-sm text-slate-400">Switching languages = restarting brain.</p>
                                            </div>
                                        </div>
                                        <div className="flex gap-3">
                                            <span className="font-bold text-red-500/50 text-xl">05</span>
                                            <div>
                                                <h4 className="font-bold text-slate-200">No Passive Watching</h4>
                                                <p className="text-sm text-slate-400">If you can't pause and predict next step → Stop video.</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-indigo-500/5 border border-indigo-500/20 rounded-xl p-6 text-center">
                                    <BrainCircuit className="mx-auto mb-3 text-indigo-400" size={32}/>
                                    <h3 className="font-bold text-lg text-indigo-200 mb-2">Final Truth</h3>
                                    <p className="text-slate-300 italic">"I don't aim to finish the playlist. I aim to finish interviews."</p>
                                </div>
                            </div>
                        )}

                    </div>

                    {/* FOOTER */}
                    <div className="fixed bottom-0 w-full bg-slate-950/80 backdrop-blur border-t border-slate-800 py-3 text-center text-xs text-slate-600 z-10">
                        <p>Striver A2Z DSA Tracker • Phase-wise Architecture</p>
                    </div>

                    {/* MODAL */}
                    {activeVideo && (
                        <CommentModal 
                            video={activeVideo} 
                            onClose={() => setActiveVideo(null)} 
                            user={user}
                        />
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
